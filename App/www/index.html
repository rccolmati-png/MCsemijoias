<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Márcia Colmati Semijoias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --rose:#F4B5A3; --rose-d:#E89A85; --rose-l:#FBE3DA; --burg:#8A3E3E; --burg-d:#6B2D2D;
  --char:#25211F; --char-2:#3A3431; --gold:#C9A25B; --gold-l:#E6C68A; --gold-d:#B0843E;
  --ivory:#FBF7F2; --card:#FFFFFF; --line:#EADFD6; --muted:#8A7F78; --text:#2B2523;
  --ok:#3F7D5A; --warn:#C4862B; --bad:#B23A3A; --info:#4F6F8F;
  --r:14px; --sh:0 1px 2px rgba(60,40,30,.05),0 8px 24px rgba(60,40,30,.07);
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ivory);color:var(--text);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;color:var(--char)}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.bdg{display:none;margin-left:6px;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;padding:1px 7px;letter-spacing:0;vertical-align:middle}.bdg.on{display:inline-block}
.muted{color:var(--muted)} .nowrap{white-space:nowrap} .right{text-align:right} .center{text-align:center}
.pos{color:var(--ok)} .neg{color:var(--bad)}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:1000;background:radial-gradient(ellipse at 50% 45%,#3a2f2b 0%,#1d1816 70%);display:flex;align-items:center;justify-content:center;transition:opacity .9s ease}
#splash canvas{position:absolute;inset:0;width:100%;height:100%}
#splashLogoWrap{position:relative;width:min(300px,56vw);aspect-ratio:460/478;opacity:0;transform:scale(.82);filter:blur(10px) brightness(.6);transition:opacity 1.3s ease,transform 1.6s cubic-bezier(.2,.8,.2,1),filter 1.6s ease;will-change:transform}
#splashLogoWrap.revealed{opacity:1;transform:scale(1);filter:blur(0) brightness(1)}
#splashLogo{width:100%;height:100%;display:block;object-fit:contain;filter:drop-shadow(0 0 26px rgba(230,198,138,.35))}
#splashShine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.95) 50%,transparent 65%);background-size:250% 100%;background-position:160% 0;mix-blend-mode:overlay;-webkit-mask-image:var(--logo);mask-image:var(--logo);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
#splashShine.go{animation:shine 1.6s ease .2s 1 forwards}
@keyframes shine{from{background-position:160% 0}to{background-position:-60% 0}}
#splashTag{position:absolute;bottom:11vh;left:0;right:0;text-align:center;font-family:var(--serif);font-size:20px;letter-spacing:.42em;color:var(--gold-l);opacity:0;text-transform:uppercase;transition:opacity 1.2s ease}
#splashTag.on{opacity:.85}
#splash.out{opacity:0;pointer-events:none}
#splashSkip{position:absolute;right:18px;bottom:16px;background:none;border:0;color:#b9a98d;font-size:12px;cursor:pointer;opacity:.7;letter-spacing:.1em}

/* ---------- Header ---------- */
#app{opacity:0;transition:opacity .6s ease}
#app.on{opacity:1}
header.top{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#2a2422,#1f1a18);color:#eadfce;display:flex;align-items:center;gap:20px;padding:0 24px;height:68px;box-shadow:0 2px 14px rgba(0,0,0,.25)}
.brand-t{font-family:var(--serif);font-size:19px;letter-spacing:.14em;color:var(--gold-l);text-transform:uppercase;white-space:nowrap}
.brand-t small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.3em;color:#a8998a}
nav.menu{display:flex;gap:4px;margin-left:18px;flex:1;opacity:0;transform:translateY(-6px);transition:all .6s ease .15s;overflow-x:auto;scrollbar-width:none}
nav.menu.on{opacity:1;transform:none}
nav.menu button{background:none;border:0;color:#cdbfae;padding:10px 16px;border-radius:999px;cursor:pointer;font-size:13px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;transition:.2s}
nav.menu button:hover{color:#fff;background:rgba(255,255,255,.07)}
nav.menu button.act{color:var(--char);background:linear-gradient(135deg,var(--gold-l),var(--gold))}
#hdrLogo{height:52px;width:auto;margin-left:auto;display:block;filter:drop-shadow(0 0 8px rgba(201,162,91,.25))}
.user-chip{font-size:11px;color:#a8998a;text-align:right;line-height:1.3;white-space:nowrap}
.user-chip b{color:var(--gold-l);font-weight:500}
@media(max-width:860px){header.top{padding:0 12px;gap:8px;height:60px}.brand-t,.user-chip{display:none}#hdrLogo{height:44px}nav.menu{margin-left:0}}

main{max-width:1500px;margin:0 auto;padding:22px 24px 80px}
@media(max-width:700px){main{padding:14px 12px 70px}}
.view{display:none;animation:fade .35s ease}.view.act{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.page-h h1{font-size:34px;letter-spacing:.01em}
.page-h p{margin:2px 0 0;color:var(--muted);font-size:13px}

/* ---------- componentes ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card h3{font-size:20px;margin-bottom:10px}
.card h3 small{font-family:var(--sans);font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.04em;margin-left:6px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g65{grid-template-columns:1.6fr 1fr}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.g65{grid-template-columns:1fr}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--gold-l),var(--gold-d))}
.kpi .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:4px}
.kpi .v{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--char);margin:2px 0 2px;line-height:1.1}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi .d .up{color:var(--ok);font-weight:500}.kpi .d .dn{color:var(--bad);font-weight:500}
.kpi.warn::before{background:var(--warn)}.kpi.bad::before{background:var(--bad)}
.tip{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--line);color:var(--muted);font-size:10px;line-height:14px;text-align:center;cursor:help;text-transform:none;letter-spacing:0}

.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;box-shadow:var(--sh)}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;min-height:38px;font-size:14px;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,91,.18)}
textarea{width:100%;resize:vertical}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 16px;min-height:38px;cursor:pointer;font-size:13px;letter-spacing:.06em;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--burg)}
.btn.pri{background:linear-gradient(135deg,var(--burg),var(--burg-d));color:#fff;border-color:var(--burg-d)}
.btn.pri:hover{filter:brightness(1.12);color:#fff}
.btn.gold{background:linear-gradient(135deg,var(--gold-l),var(--gold));border-color:var(--gold-d);color:var(--char);font-weight:500}
.btn.danger{color:var(--bad);border-color:#e7c3c3}.btn.danger:hover{background:#fbeeee}
.btn.sm{min-height:30px;padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;font-size:13px}
.seg button.act{background:var(--char);color:var(--gold-l)}

.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.sub button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px;cursor:pointer;font-size:13px}
.sub button.act{background:var(--burg);color:#fff;border-color:var(--burg)}

table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{position:sticky;top:0;background:#faf4ee;text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
table.t th.sort{cursor:pointer}table.t th.sort:hover{color:var(--burg)}
table.t td{padding:8px 10px;border-bottom:1px solid #f3ebe4;vertical-align:middle}
table.t tr:hover td{background:#fffaf5}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;max-height:520px;border-radius:10px}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;letter-spacing:.05em;background:#f3ebe4;color:var(--text)}
.chip.ok{background:#e3f1e9;color:var(--ok)}.chip.warn{background:#fbf0dc;color:#9a6a17}.chip.bad{background:#f9e4e4;color:var(--bad)}.chip.info{background:#e5edf5;color:var(--info)}.chip.gray{background:#eee;color:#777}

.ins{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ins .i{border:1px solid var(--line);border-left:4px solid var(--info);border-radius:10px;padding:12px 14px;background:#fff}
.ins .i.alerta{border-left-color:var(--warn)}.ins .i.critico{border-left-color:var(--bad)}.ins .i.positivo{border-left-color:var(--ok)}
.ins .i b{font-family:var(--serif);font-size:18px;display:block;margin-bottom:3px}
.ins .i span{font-size:13px;color:#5b514c}
.chartbox{position:relative;height:300px}.chartbox.tall{height:360px}.chartbox.sm{height:240px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.aviso{background:#fbf3e3;border:1px solid #efd9a8;border-radius:10px;padding:10px 14px;font-size:13px;color:#7a5a17;margin-bottom:14px}
.aviso.bad{background:#fbeaea;border-color:#e9bcbc;color:#8d2f2f}.aviso.info{background:#eaf1f8;border-color:#c5d6e8;color:#34536f}

/* modal / toast */
#modalBg{position:fixed;inset:0;background:rgba(30,22,20,.55);backdrop-filter:blur(3px);z-index:500;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:4vh 12px}
#modalBg.on{display:flex}
.modal{background:#fff;border-radius:18px;width:min(980px,100%);box-shadow:0 30px 80px rgba(0,0,0,.35);padding:24px;position:relative;animation:fade .25s}
.modal.sm{width:min(520px,100%)}
.modal h2{font-size:28px;margin-bottom:12px}
.modal .x{position:absolute;right:16px;top:12px;border:0;background:none;font-size:26px;cursor:pointer;color:var(--muted)}
#toasts{position:fixed;right:16px;bottom:16px;z-index:900;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--char);color:#fff;border-radius:10px;padding:11px 16px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:380px;font-size:13.5px;border-left:4px solid var(--gold);animation:fade .25s}
.toast.err{border-left-color:var(--bad)}.toast.ok{border-left-color:var(--ok)}
#loader{position:fixed;left:0;top:0;right:0;height:3px;z-index:999;background:linear-gradient(90deg,transparent,var(--gold),transparent);background-size:50% 100%;background-repeat:no-repeat;animation:ld 1s linear infinite;display:none}
#loader.on{display:block}
@keyframes ld{from{background-position:-50% 0}to{background-position:150% 0}}
.skel{background:linear-gradient(90deg,#f3ebe4 25%,#fbf6f1 50%,#f3ebe4 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:10px;min-height:90px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

/* lançamentos */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.form-grid label.w2{grid-column:span 2}.form-grid label.full{grid-column:1/-1}
.itens-t td{padding:5px 6px}.itens-t input{width:100%}
.sugest{position:absolute;z-index:80;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh);max-height:280px;overflow:auto;min-width:320px}
.sugest div{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #f5eee8}.sugest div:hover{background:#fff6ee}
.totbar{display:flex;gap:22px;justify-content:flex-end;align-items:center;flex-wrap:wrap;padding:12px 4px}
.totbar b{font-family:var(--serif);font-size:26px}

/* IA */
.ia-wrap{display:grid;grid-template-columns:260px 1fr;gap:14px;min-height:62vh}
@media(max-width:900px){.ia-wrap{grid-template-columns:1fr}}
.ia-side{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}
.ia-side .cv{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;border:1px solid transparent}
.ia-side .cv:hover{background:#fff6ee}.ia-side .cv.act{background:#fff;border-color:var(--gold)}
.chat{display:flex;flex-direction:column;height:68vh}
.msgs{flex:1;overflow:auto;padding:6px 4px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:12px 16px;border-radius:16px;line-height:1.55;font-size:14.5px}
.msg.u{align-self:flex-end;background:var(--char);color:#f3e9da;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;box-shadow:var(--sh)}
.msg.a h1,.msg.a h2,.msg.a h3,.md h1,.md h2,.md h3{font-size:20px;margin:12px 0 6px;color:var(--burg)}
.md p{margin:6px 0}.md ul,.md ol{margin:6px 0;padding-left:20px}.md table{border-collapse:collapse;margin:8px 0;font-size:13px;width:100%}
.md th,.md td{border:1px solid var(--line);padding:5px 8px;text-align:left}.md th{background:#faf4ee}.md code{background:#f3ebe4;padding:1px 5px;border-radius:4px}
.sugs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.sugs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer}.sugs button:hover{border-color:var(--gold);color:var(--burg)}
.composer{display:flex;gap:8px;padding-top:8px;border-top:1px solid var(--line)}
.composer textarea{min-height:46px;height:46px}
.typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.uso{font-size:11px;color:var(--muted);margin-top:6px}
.bar{height:8px;background:#f3ebe4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-l),var(--gold-d))}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.esgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.escard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;box-shadow:var(--sh);transition:transform .15s,box-shadow .15s}
.escard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(60,40,30,.12)}
.esph{height:150px;background:#f6efe8;display:flex;align-items:center;justify-content:center;overflow:hidden}
.esph img{width:100%!important;height:150px!important;border-radius:0!important;margin:0!important}
.esb{padding:10px 12px}.esc{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px}
.esd{font-size:13px;margin:4px 0;min-height:34px;line-height:1.3}
.esq{display:flex;align-items:baseline;gap:6px;margin:2px 0 4px}.esq span{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;color:var(--burg)}.esq span.neg{color:var(--bad)}.esq small{color:var(--muted);font-size:11px}
@media print{header.top,.filters,.sub,.btn,nav{display:none!important}body{background:#fff}.card,.kpi{box-shadow:none}}
</style>

<style>
/* ===== Adaptação para iPhone (mesmas cores/fontes do sistema) ===== */
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;background:var(--char)}
body{min-height:100dvh;background:var(--ivory)}
input,select,textarea{font-size:16px!important;min-height:44px}
.btn{min-height:44px;font-size:14px}.btn.sm{min-height:36px}
body.modal-on{overflow:hidden}
#app{display:none}#app.on{display:block}
header.mtop{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,#2a2422,#1f1a18);color:#eadfce;display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 8px) 16px 10px;box-shadow:0 2px 14px rgba(0,0,0,.28)}
header.mtop .brand-t{display:block!important;flex:1;font-size:17px}
#hdrLogo{height:46px;width:auto;margin:0;opacity:0;filter:drop-shadow(0 0 8px rgba(201,162,91,.3));order:0}
#mCfg{border:1px solid rgba(230,198,138,.35);background:rgba(255,255,255,.06);color:var(--gold-l);border-radius:12px;width:44px;height:44px;font-size:20px;cursor:pointer}
main#mMain{padding:18px 16px calc(env(safe-area-inset-bottom) + 28px);max-width:560px;margin:0 auto}
.hero{margin:6px 2px 16px}.hero h1{font-size:30px;line-height:1.1}.hero p{margin:4px 0 0;color:var(--muted)}
.big{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:0;border-radius:22px;padding:22px 20px;margin-bottom:14px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 14px 30px rgba(60,40,30,.22);transition:transform .15s}
.big:active{transform:scale(.97)}
.big svg{flex:none;width:46px;height:46px}
.big b{display:block;font-family:var(--serif);font-size:28px;font-weight:600;line-height:1}
.big small{display:block;margin-top:5px;font-size:13px;opacity:.85;letter-spacing:.02em}
.big.venda{background:linear-gradient(135deg,var(--burg),var(--burg-d) 70%,#4a1f1f);color:#fff}
.big.venda svg{stroke:var(--gold-l)}
.big.compra{background:linear-gradient(135deg,var(--gold-l),var(--gold) 55%,var(--gold-d));color:var(--char)}
.big.compra svg{stroke:var(--char)}
.big::after{content:'';position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%)}
.foot{margin-top:22px;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.04em}
.foot b{color:var(--burg)}
.card.m{background:#fff;border-radius:18px;padding:20px;box-shadow:var(--sh)}
.card.m label{display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
/* janela de formulário em tela cheia */
#modalBg{padding:0;align-items:stretch;background:#fff;backdrop-filter:none}
#modal.modal{width:100%;min-height:100%;border-radius:0;box-shadow:none;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 14px);animation:slideup .28s cubic-bezier(.2,.8,.2,1)}
@keyframes slideup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#modal .x{top:calc(env(safe-area-inset-top) + 8px);right:10px;width:44px;height:44px;font-size:30px}
#modal h2{font-size:26px;padding-right:44px;margin-bottom:10px}
#modal .form-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
#modal{overflow-x:hidden}#modal input,#modal select{min-width:0;max-width:100%}
.fprev:empty{display:none}.sugest div{text-align:left}
#modal .form-grid label.w2,#modal .form-grid label.full{grid-column:1/-1}
#modal > div[style*="justify-content:flex-end"]:last-child{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 22%);padding:16px 0 calc(env(safe-area-inset-bottom) + 6px);margin-top:10px;z-index:5}
#modal > div[style*="justify-content:flex-end"]:last-child .btn{flex:1;min-height:50px;font-size:15px}
.totbar{gap:10px 18px;justify-content:space-between;background:var(--ivory);border-radius:14px;padding:12px 14px;margin-top:12px}
.totbar b{font-size:24px}
/* itens: tabela vira cartões */
.itens-t,.itens-t tbody{display:block;width:100%!important;min-width:0!important}
.itens-t thead{display:none}
.itens-t tr{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 12px;margin-bottom:12px;border:1px solid var(--line);border-radius:16px;background:#fffdfb;position:relative}
.itens-t td{display:block;width:auto!important;padding:0!important;position:relative}
.itens-t td::before{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.itens-t td:last-child{position:absolute;right:8px;top:8px}.itens-t td:last-child::before{content:none}
.itens-t td:first-child{padding-right:46px!important}
tr.vi td:nth-child(1)::before{content:'Produto'}tr.vi td:nth-child(2)::before{content:'Qtd'}tr.vi td:nth-child(3)::before{content:'Preço un. (R$)'}tr.vi td:nth-child(4)::before{content:none}
tr.vi td:nth-child(1),tr.vi td.info{grid-column:1/-1}tr.vi td.info:empty{display:none}
tr.ci td:nth-child(1)::before{content:'Código'}tr.ci td:nth-child(2)::before{content:'Descrição'}tr.ci td:nth-child(3)::before{content:'Categoria'}tr.ci td:nth-child(4)::before{content:'Qtd'}tr.ci td:nth-child(5)::before{content:'Custo un.'}tr.ci td:nth-child(6)::before{content:'Desp. adic.'}tr.ci td:nth-child(7)::before{content:'Preço de venda'}tr.ci td:nth-child(8)::before{content:'Foto'}
tr.ci td:nth-child(1){grid-column:1/-1}tr.ci td:nth-child(2),tr.ci td:nth-child(8){grid-column:1/-1}
tr.ci td:nth-child(8) div[style*="display:flex"]{flex-wrap:wrap}
tr.ci .fbtn{min-height:44px;flex:1}tr.ci .foto{flex:1 1 100%;order:3}
.uc{font-size:12px!important}.uc a{color:var(--burg);font-weight:500;padding:6px 2px}
#vAdd,#cAdd{width:100%;min-height:46px;border-style:dashed}
.sugest{min-width:0;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.28)}
.sugest div{padding:12px 14px;font-size:15px}
#toasts{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 90px);align-items:stretch}.toast{max-width:none;font-size:14px}
.modal.sm{width:min(420px,100%)}

</style>

<script>
/* ============ Núcleo: API, utilitários, UI base ============ */
const App = { boot: null, usuario: '', papel: 'OPERADOR', filtros: {}, view: 'dashboard', charts: {}, cache: {} };
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
let _pend = 0;

/* Rotas somente de leitura: o resultado fica guardado alguns segundos no navegador (trocar de aba vira instantâneo).
   Qualquer gravação feita por aqui limpa esse guarda; alterações de outra pessoa aparecem em até CACHE_MS. */
const LEITURA = /^(dashboard|analise[A-Z]\w*|estoquePainel|estoqueFicha|recPainel|recCobrarHoje|recClientes|recCliente|recFluxo|recRecebimentos|lancamentosListar|lancamentoDetalhe|pendenciasListar|insightsProativos|ajustesListar|codigoUltimo|iaStatus|iaUso|iaConversas|iaRelatorios|cashbackExtrato)$/;
const CACHE_MS = 45000, _voo = {}; let _rc = {}, _gen = 0;
function api(rota, payload) {
  const leitura = LEITURA.test(rota), gen = _gen, chave = leitura ? rota + '|' + JSON.stringify(payload || {}) : '';
  if (leitura) {
    const c = _rc[chave]; if (c && Date.now() - c.t < CACHE_MS) return Promise.resolve(JSON.parse(c.j));
    if (_voo[chave]) return _voo[chave].then(d => JSON.parse(JSON.stringify(d === undefined ? null : d)));
  } else { _rc = {}; _gen++; }
  const p = new Promise((resolve, reject) => {
    _pend++; $('#loader').classList.add('on'); const t0 = Date.now();
    const fim = () => { _pend = Math.max(0, _pend - 1); if (!_pend) $('#loader').classList.remove('on'); };
    if (!(window.google && google.script && google.script.run)) { fim(); return reject(new Error('Execute pelo Web App publicado (google.script.run indisponível).')); }
    google.script.run
      .withSuccessHandler(r => { fim(); medirTempo(rota, Date.now() - t0, r && r.ms); if (r && r.ok) { if (!leitura) { _rc = {}; _gen++; } if (leitura && gen === _gen) _rc[chave] = { t: Date.now(), j: JSON.stringify(r.dados === undefined ? null : r.dados) }; resolve(r.dados); } else { const e = new Error((r && r.erro && r.erro.mensagem) || 'Erro desconhecido'); e.codigo = r && r.erro && r.erro.codigo; e.detalhes = r && r.erro && r.erro.detalhes; reject(e); } })
      .withFailureHandler(err => { fim(); reject(new Error('Falha de comunicação com o servidor: ' + (err && err.message ? err.message : err))); })
      .api(rota, payload || {});
  });
  if (leitura) { _voo[chave] = p; const l = () => { delete _voo[chave]; }; p.then(l, l); }
  return p;
}
/** Guarda o tempo da última chamada (total e dentro do servidor) para diagnóstico: aparece ao passar o mouse no seu nome. */
function medirTempo(rota, total, servidor) {
  App.tempos = App.tempos || []; App.tempos.unshift({ rota: rota, total: total, servidor: servidor === undefined ? null : servidor }); App.tempos.length = Math.min(App.tempos.length, 8);
  const el = document.getElementById('userChip'); if (!el) return;
  el.title = 'Últimas chamadas (total / no servidor):\n' + App.tempos.map(t => t.rota + ': ' + (t.total / 1000).toFixed(1) + ' s / ' + (t.servidor === null ? '?' : (t.servidor / 1000).toFixed(1) + ' s')).join('\n');
}
/** Reduz a foto no navegador (lado maior 1200 px, JPEG) antes de enviar: sobe em segundos e ocupa pouco espaço no Drive. */
function reduzirImagem(file, lado, qual) {
  lado = lado || 1200; qual = qual || 0.82;
  return new Promise((resolve, reject) => {
    if (file.size > 30 * 1024 * 1024) return reject(new Error('Arquivo muito grande (máx. 30 MB).'));
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight)), w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
        const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url); resolve({ dataUrl: c.toDataURL('image/jpeg', qual), w: w, h: h });
      } catch (e) { URL.revokeObjectURL(url); reject(new Error('Não consegui processar esta imagem.')); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Não consegui abrir esta imagem. Use JPG, PNG ou WEBP.')); };

}

async function apiT(rota, payload) { try { return await api(rota, payload); } catch (e) { toast(e.message, 'err'); return null; } }

/* ---------- formatação ---------- */
const nf0 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });

const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

const Fotos = {
  cache: {}, fila: [], ativos: 0,
  /** Pede a imagem ao servidor (2 por vez, com cache em memória). */
  buscar(link, tam) {
    const k = link + '|' + (tam > 400 ? 'g' : 'p'); if (this.cache[k]) return Promise.resolve(this.cache[k]);
    return new Promise((res, rej) => { this.fila.push({ k, link, tam, res, rej }); this.rodar(); });
  },
  rodar() {
    while (this.ativos < 2 && this.fila.length) {
      const j = this.fila.shift(); this.ativos++;
      api('fotoDados', { link: j.link, tam: j.tam }).then(r => { this.cache[j.k] = r.dataUrl; j.res(r.dataUrl); }).catch(e => j.rej(e)).finally(() => { this.ativos--; this.rodar(); });
    }
  },
  erro(img) {
    if (img.dataset.tent) { img.style.visibility = 'hidden'; return; } img.dataset.tent = '1';
    this.buscar(img.dataset.link, 300).then(d => { img.src = d; }).catch(() => { img.style.visibility = 'hidden'; });
  },
  ampliar(img) {
    const link = img.dataset.link; if (!link) return;
    const d = dialogo('<div style="text-align:center"><img id="fAmp" referrerpolicy="no-referrer" src="' + esc(fotoUrl(link, 900)) + '" style="max-width:100%;max-height:75vh;border-radius:10px;cursor:zoom-out"><div class="muted" style="margin-top:8px;font-size:12px">clique na imagem para fechar</div></div>');
    d.box.style.width = 'min(720px,100%)'; const im = $('#fAmp', d.box); im.onclick = () => d.fechar();
    im.onerror = () => { if (im.dataset.t) { im.alt = 'Não foi possível carregar a imagem'; return; } im.dataset.t = 1; this.buscar(link, 900).then(x => { im.src = x; }).catch(() => { im.alt = 'Não foi possível carregar a imagem'; }); };
  }
};

/* ---------- Markdown mínimo e seguro (escapa tudo antes) ---------- */
function md(txt) {
  const linhas = esc(txt || '').split('\n'); let h = '', lista = null, tab = [];
  const inl = s => s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*?)\*/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const fechaLista = () => { if (lista) { h += '</' + lista + '>'; lista = null; } };
  const fechaTab = () => { if (tab.length) { const rows = tab.filter(r => !/^\s*\|?[\s:|-]+\|?\s*$/.test(r)); h += '<table>' + rows.map((r, i) => { const c = r.replace(/^\s*\||\|\s*$/g, '').split('|').map(x => inl(x.trim())); return '<tr>' + c.map(x => i === 0 ? '<th>' + x + '</th>' : '<td>' + x + '</td>').join('') + '</tr>'; }).join('') + '</table>'; tab = []; } };
  linhas.forEach(l => {
    if (/^\s*\|.*\|\s*$/.test(l)) { fechaLista(); tab.push(l); return; } else fechaTab();
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { fechaLista(); h += '<h' + Math.min(3, m[1].length + 1) + '>' + inl(m[2]) + '</h' + Math.min(3, m[1].length + 1) + '>'; }
    else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (lista !== 'ul') { fechaLista(); h += '<ul>'; lista = 'ul'; } h += '<li>' + inl(m[1]) + '</li>'; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (lista !== 'ol') { fechaLista(); h += '<ol>'; lista = 'ol'; } h += '<li>' + inl(m[1]) + '</li>'; }
    else if (!l.trim()) { fechaLista(); }
    else { fechaLista(); h += '<p>' + inl(l) + '</p>'; }
  });
  fechaLista(); fechaTab(); return '<div class="md">' + h + '</div>';
}

/* tabela ordenável simples */
function tabela(cols, rows, opts) {
  opts = opts || {}; const id = 't' + Math.random().toString(36).slice(2, 7);
  const ordem = { c: null, d: 1 }; let dados = rows.slice();
  const render = () => {

    el.innerHTML = '<table class="t"><thead><tr>' + cols.map((c, i) => '<th class="' + (c.n ? 'n ' : '') + (c.sort === false ? '' : 'sort') + '" data-i="' + i + '">' + c.t + (ordem.c === i ? (ordem.d > 0 ? ' ▲' : ' ▼') : '') + '</th>').join('') + '</tr></thead><tbody>' +
      (dados.length ? dados.slice(0, opts.max || 500).map(r => '<tr' + (opts.onRow ? ' data-k="' + esc(r._k || '') + '" style="cursor:pointer"' : '') + '>' + cols.map(c => '<td class="' + (c.n ? 'n' : '') + '">' + (c.f ? c.f(r) : esc(r[c.k])) + '</td>').join('') + '</tr>').join('') : '<tr><td colspan="' + cols.length + '" class="empty">Nenhum registro.</td></tr>') + '</tbody></table>';
    $$('th.sort', el).forEach(th => th.onclick = () => { const i = +th.dataset.i, c = cols[i]; if (ordem.c === i) ordem.d *= -1; else { ordem.c = i; ordem.d = c.n ? -1 : 1; } const k = c.s || c.k; dados.sort((a, b) => { const x = typeof k === 'function' ? k(a) : a[k], y = typeof k === 'function' ? k(b) : b[k]; return (x === y ? 0 : (x === null || x === undefined || x < y) ? -1 : 1) * ordem.d; }); render(); });
    if (opts.onRow) $$('tbody tr', el).forEach((tr, i) => tr.onclick = () => opts.onRow(dados[i]));
  };
  setTimeout(render, 0);
  return '<div class="tw" id="' + id + '" style="' + (opts.h ? 'max-height:' + opts.h : '') + '"></div>';
}

/* ---------- Splash ---------- */
function splash(fimCb) {
  const sp = $('#splash'), wrap = $('#splashLogoWrap'), img = $('#splashLogo'), cv = $('#splashCanvas'), shine = $('#splashShine'), tag = $('#splashTag');
  img.src = LOGOS.full_gold; $('#hdrLogo').src = LOGOS.full_gold; shine.style.setProperty('--logo', 'url(' + LOGOS.full_gold + ')');
  const reduz = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  let encerrado = false;
  const bg = document.createElement('div'); bg.style.cssText = 'position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,#3a2f2b 0%,#1d1816 70%);transition:opacity .9s ease'; sp.insertBefore(bg, sp.firstChild); sp.style.background = 'none';
  const finalizar = () => {
    if (encerrado) return; encerrado = true; parar = true;
    if (reduz) { sp.classList.add('out'); setTimeout(() => sp.remove(), 300); $('#hdrLogo').style.opacity = 1; return fimCb(); }
    // FLIP: leva a logo do centro até o canto superior direito
    const alvo = $('#hdrLogo').getBoundingClientRect(), de = wrap.getBoundingClientRect();
    const esc_ = alvo.height / de.height, dx = (alvo.left + alvo.width / 2) - (de.left + de.width / 2), dy = (alvo.top + alvo.height / 2) - (de.top + de.height / 2);
    bg.style.opacity = 0; cv.style.transition = 'opacity .8s'; cv.style.opacity = 0; tag.classList.remove('on'); $('#splashSkip').style.display = 'none';
    wrap.style.transition = 'transform 1.25s cubic-bezier(.65,0,.25,1), filter 1.2s'; wrap.style.transformOrigin = 'center center';
    wrap.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + esc_ + ')';
    setTimeout(() => { $('#hdrLogo').style.opacity = 1; wrap.style.transition = 'opacity .3s'; wrap.style.opacity = 0; fimCb(); }, 1250);
    setTimeout(() => sp.remove(), 1700);
  };
  $('#splashSkip').onclick = finalizar;
  // partículas douradas
  const ctx = cv.getContext('2d'); let W, H, parts = [], parar = false, t0 = performance.now();
  const dim = () => { const r = window.devicePixelRatio || 1; W = cv.width = innerWidth * r; H = cv.height = innerHeight * r; ctx.setTransform(r, 0, 0, r, 0, 0); W = innerWidth; H = innerHeight; };
  dim();
  if (!reduz) {
    for (let i = 0; i < 110; i++) parts.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.8 + .4, a: Math.random() * Math.PI * 2, v: Math.random() * .25 + .05, tw: Math.random() * 6, c: Math.random() > .3 ? '230,198,138' : '244,181,163' });
    const loop = now => {
      if (parar) return; const t = (now - t0) / 1000; ctx.clearRect(0, 0, W, H);
      parts.forEach(p => {
        p.a += .004; p.x += Math.cos(p.a) * p.v * 2; p.y += Math.sin(p.a * 1.3) * p.v * 2 - .05;
        if (t > 1.6 && t < 3.2) { p.x += (W / 2 - p.x) * .0016; p.y += (H / 2 - p.y) * .0016; }
        const al = (.25 + .75 * Math.abs(Math.sin(t * 1.4 + p.tw))) * Math.min(1, t / 1.2);
        ctx.beginPath(); ctx.fillStyle = 'rgba(' + p.c + ',' + al.toFixed(3) + ')'; ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
        if (p.r > 1.7) { ctx.strokeStyle = 'rgba(' + p.c + ',' + (al * .5).toFixed(3) + ')'; ctx.lineWidth = .6; ctx.beginPath(); ctx.moveTo(p.x - 5, p.y); ctx.lineTo(p.x + 5, p.y); ctx.moveTo(p.x, p.y - 5); ctx.lineTo(p.x, p.y + 5); ctx.stroke(); }
      });
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
  addEventListener('resize', dim);
  // cronograma
  setTimeout(() => wrap.classList.add('revealed'), reduz ? 0 : 500);
  setTimeout(() => shine.classList.add('go'), reduz ? 0 : 1500);
  setTimeout(() => tag.classList.add('on'), reduz ? 0 : 2000);
  setTimeout(finalizar, reduz ? 400 : 4300);
}

    tb.innerHTML = '<table class="t"><thead><tr><th>#</th><th class="n">Valor (R$)</th><th>Vencimento</th>' + (cfg.recebida ? '<th title="Já recebida no ato da venda">Já recebida</th>' : '') + '<th></th></tr></thead><tbody>' +
      S.rows.map((r, i) => r.travada
        ? '<tr style="opacity:.75"><td>' + (i + 1) + '</td><td class="n">' + brl(r.valor) + '</td><td>' + dataBR(r.vencimento) + '</td>' + (cfg.recebida ? '<td></td>' : '') + '<td><span class="chip ' + (r.recebida ? 'ok' : 'warn') + '" title="Esta parcela já tem recebimento e não é alterada aqui">' + (r.recebida ? 'paga' : 'parcial') + '</span></td></tr>'
        : '<tr data-i="' + i + '"><td>' + (i + 1) + '</td><td class="n"><input type="number" step="0.01" min="0" class="plV" value="' + (r.valor === '' ? '' : r.valor) + '" style="width:110px;text-align:right"></td><td><input type="date" class="plVc" value="' + esc(r.vencimento || '') + '"></td>' +
          (cfg.recebida ? '<td><input type="checkbox" class="plR"' + (r.recebida ? ' checked' : '') + '></td>' : '') + '<td><button type="button" class="btn sm plRm" title="Remover parcela">×</button></td></tr>').join('') + '</tbody></table>';
    $$('tr[data-i]', tb).forEach(tr => { const i = +tr.dataset.i, r = S.rows[i];
      $('.plV', tr).oninput = e => { r.valor = e.target.value === '' ? '' : +e.target.value; S.tocado = true; rodape(); cfg.onChange && cfg.onChange(); };
      $('.plVc', tr).onchange = e => { r.vencimento = e.target.value; S.tocado = true; cfg.onChange && cfg.onChange(); };
      if ($('.plR', tr)) $('.plR', tr).onchange = e => { r.recebida = e.target.checked; cfg.onChange && cfg.onChange(); };
      $('.plRm', tr).onclick = () => { S.rows.splice(i, 1); S.tocado = true; render(); cfg.onChange && cfg.onChange(); };
    });
    rodape();
  };
  const gerar = (n, total) => {
    const fixas = S.rows.filter(r => r.travada), fixoSoma = fixas.reduce((s, r) => s + (+r.valor || 0), 0);
    const alvo = total !== undefined ? total : S.alvo; n = Math.max(1, Math.min(36, n | 0));
    const intervalo = +$('.plInt', host).value || 30, d1 = $('.plD1', host).value || addDias(base(), intervalo);
    const restante = alvo === null || alvo === undefined ? 0 : Math.max(0, Math.round((alvo - fixoSoma) * 100) / 100);
    const v = Math.floor(restante / n * 100) / 100, novas = [];
    for (let i = 0; i < n; i++) novas.push({ valor: alvo === null || alvo === undefined ? '' : (i === n - 1 ? Math.round((restante - v * (n - 1)) * 100) / 100 : v), vencimento: addDias(d1, i * intervalo), recebida: false });
    S.rows = fixas.concat(novas); S.tocado = false; render();
  };
  $('.plGer', host).onclick = () => { const n = cfg.pedirN ? +$('.plN', host).value || 1 : (cfg.nAtual ? cfg.nAtual() - S.rows.filter(r => r.travada).length : S.rows.filter(r => !r.travada).length || 1); gerar(n); cfg.onChange && cfg.onChange(); };
  $('.plAdd', host).onclick = () => { if (S.rows.length >= 36) return toast('Máximo de 36 parcelas.', 'err'); const ult = S.rows.length ? S.rows[S.rows.length - 1].vencimento : base(); S.rows.push({ valor: '', vencimento: addDias(ult || base(), +$('.plInt', host).value || 30), recebida: false }); S.tocado = true; render(); cfg.onChange && cfg.onChange(); };
  render();
  return { S: S, gerar: gerar, render: render, setAlvo: v => { S.alvo = v; rodape(); }, soma: soma,
    obter: () => S.rows.map(r => r.travada ? { id: r.id } : { valor: +r.valor || 0, vencimento: r.vencimento, recebida: !!r.recebida }) };
}

const Receber = {
  async telefone(cid, atual) {
    return new Promise(res => {
      const d = dialogo('<h2>Telefone / WhatsApp</h2><label class="muted" style="font-size:12px">Com DDD</label><input id="rtTel" value="' + esc(atual || '') + '" placeholder="(19) 99999-9999"><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" id="rtNo">Cancelar</button><button class="btn pri" id="rtOk">Salvar</button></div>');
      $('#rtNo', d.box).onclick = () => { d.fechar(); res(null); };
      $('#rtOk', d.box).onclick = async () => { const v = $('#rtTel', d.box).value.trim(); const r = await apiT('recTelefone', { cliente_id: cid, telefone: v }); if (!r) return; d.fechar(); res(v); };
    });
  },
  async whats(c) {
    let tel = c.telefone; if (soDigitos(tel).length < 10) { tel = await this.telefone(c.cliente_id || c.id, tel); if (!tel) return; c.telefone = tel; }
    const l = linkWhats(tel, c.mensagem); if (!l) return toast('Telefone inválido.', 'err'); window.open(l, '_blank', 'noopener');
  },
  copiar(txt) { const ok = () => toast('Mensagem copiada.', 'ok'); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, () => this._copiaAlt(txt, ok)); else this._copiaAlt(txt, ok); },
  _copiaAlt(txt, ok) { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('Não foi possível copiar.', 'err'); } t.remove(); },

  /** Registrar pagamento: de uma parcela (p) ou do cliente (distribui das mais antigas). */
  pagar(opc, depois) {
    const porParcela = !!opc.parcela, saldo = porParcela ? opc.parcela.saldo : opc.saldo;

      '<div class="form-grid"><label>Valor recebido (R$)<input type="number" step="0.01" min="0" id="pgV" value="' + saldo + '"></label><label>Data<input type="date" id="pgD" value="' + hojeISO() + '"></label><label class="full">Observação<input id="pgO" placeholder="opcional (ex.: PIX no Itaú)"></label></div>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" id="pgNo">Cancelar</button><button class="btn pri" id="pgOk">Registrar</button></div>');
    $('#pgNo', d.box).onclick = d.fechar;
    $('#pgOk', d.box).onclick = async () => {
      const v = +$('#pgV', d.box).value; if (!(v > 0)) return toast('Informe o valor.', 'err');
      const b = $('#pgOk', d.box); b.disabled = true;
      const r = porParcela ? await apiT('recReceber', { parcela_id: opc.parcela.id, valor: v, data: $('#pgD', d.box).value, obs: $('#pgO', d.box).value })
                           : await apiT('recReceberCliente', { cliente_id: opc.cliente_id, valor: v, data: $('#pgD', d.box).value, obs: $('#pgO', d.box).value });

  editarParcela(p, depois) {

      '<div style="display:flex;gap:8px;justify-content:space-between;margin-top:14px;flex-wrap:wrap"><button class="btn danger" id="epCan"' + (p.pago > 0 ? ' disabled title="Estorne os recebimentos antes de cancelar"' : '') + '>Cancelar parcela</button><span style="display:flex;gap:8px"><button class="btn" id="epNo">Voltar</button><button class="btn pri" id="epOk">Salvar</button></span></div>');

  /** Lançar saldo anterior (cliente existente ou novo) com parcelas livres. */
  adicionar(cli, depois) {
    const d = dialogo('<h2>' + (cli ? 'Adicionar parcelas' : 'Lançar saldo anterior') + '</h2><p class="muted" style="margin:0 0 10px">Para dívidas de antes do sistema ou acertos. Cada parcela tem valor e vencimento próprios.</p>' +
      '<div class="form-grid"><label class="w2" style="position:relative">Cliente<input id="adCli" autocomplete="off" value="' + esc(cli ? cli.nome : '') + '"' + (cli ? ' disabled' : '') + ' placeholder="digite para buscar ou cadastrar"></label><label class="full">Observação<input id="adObs" value="Saldo anterior ao sistema"></label></div>' +

    $('#adOk', d.box).onclick = async () => {

      const pr = ed.obter(); if (!pr.length || pr.some(x => !(x.valor > 0) || !x.vencimento)) return toast('Preencha valor e vencimento de todas as parcelas.', 'err');
      const b = $('#adOk', d.box); b.disabled = true;
      const r = await apiT('recAdicionarParcelas', { cliente_id: escolhido && escolhido.nome === nome ? escolhido.id : '', cliente_nome: nome, parcelas: pr, obs: $('#adObs', d.box).value });

  ajustar(f, depois) {
    const d = dialogo('<h2>Ajustar saldo devedor</h2><p class="muted" style="margin:0 0 10px">' + esc(f.cliente.nome) + ' · saldo atual <b>' + brl(f.saldo) + '</b><br>Informe o saldo correto. Para menos: reduz as últimas parcelas em aberto. Para mais: cria uma parcela de ajuste.</p>' +
      '<div class="form-grid"><label>Novo saldo (R$)<input type="number" step="0.01" min="0" id="ajV" value="' + f.saldo + '"></label><label>Vencimento (se aumentar)<input type="date" id="ajD" value="' + addDias(hojeISO(), 30) + '"></label><label class="full">Motivo<input id="ajO" placeholder="ex.: desconto combinado"></label></div>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" id="ajNo">Cancelar</button><button class="btn pri" id="ajOk">Ajustar</button></div>');
    $('#ajNo', d.box).onclick = d.fechar;
    $('#ajOk', d.box).onclick = async () => { const r = await apiT('recAjustarSaldo', { cliente_id: f.cliente.id, novo_saldo: +$('#ajV', d.box).value, vencimento: $('#ajD', d.box).value, obs: $('#ajO', d.box).value || 'Ajuste de saldo' }); if (!r) return; d.fechar(); toast(r.alterado ? 'Saldo ajustado.' : 'Saldo já era esse valor.', 'ok'); Atualizar.tudo(); depois && depois(); };
  },

  mensagem(modelo, depois) {
    const d = dialogo('<h2>Mensagem de cobrança (WhatsApp)</h2><p class="muted" style="margin:0 0 8px;font-size:12px">Cole aqui o seu texto. Campos automáticos: <b>{nome}</b> (primeiro nome), <b>{nome_completo}</b>, <b>{valor_vencido}</b>, <b>{saldo_total}</b>, <b>{valor_hoje}</b>, <b>{parcelas_vencidas}</b>, <b>{dias_atraso}</b>, <b>{vencimento}</b>, <b>{lista_parcelas}</b>, <b>{lista_atrasadas}</b> (só as vencidas), <b>{lista_a_vencer}</b> (as próximas) e <b>{bloco_a_vencer}</b> (título + próximas parcelas; some se não houver). Deixe vazio para voltar ao texto padrão.</p>' +

  async ficha(cid) {
    const f = await apiT('recCliente', { id: cid }); if (!f) return;
    const abertas = f.parcelas.filter(p => p.saldo > 0);
    const linhas = f.parcelas.map(p => { const s = stRec[p.status] || ['', p.status]; return '<tr style="' + (p.status === 'CANCELADA' ? 'opacity:.45;text-decoration:line-through' : '') + '"><td>' + p.numero + '</td><td class="nowrap">' + dataBR(p.venc) + (p.atrasada ? ' <span class="chip bad">' + p.diasAtraso + 'd</span>' : '') + '</td><td class="n">' + brl(p.valor) + '</td><td class="n">' + brl(p.pago) + '</td><td class="n"><b>' + brl(p.saldo) + '</b></td><td><span class="chip ' + s[0] + '">' + s[1] + '</span></td>' +
      '<td>' + (p.op_id ? '<a href="#" data-op="' + esc(p.op_id) + '">' + esc(p.op_id) + '</a>' : '<span class="muted">' + (p.origem === 'AJUSTE' ? 'ajuste' : 'saldo anterior') + '</span>') + '</td>' +
      '<td class="nowrap">' + (p.status !== 'CANCELADA' ? (p.saldo > 0 ? '<button class="btn sm" data-r="' + p.id + '">Receber</button> ' : '') + '<button class="btn sm" data-e="' + p.id + '">Editar</button>' : '') + '</td></tr>'; }).join('');

    const m = modal('<h2>' + esc(f.cliente.nome) + '</h2><p class="muted" style="margin:0 0 10px">' + (f.cliente.telefone ? esc(f.cliente.telefone) : 'sem telefone') + ' · <a href="#" id="fTel">editar telefone</a></p>' +

      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">' + (f.saldo > 0 ? '<button class="btn pri" id="fPag">Registrar recebimento</button><button class="btn" id="fWa">WhatsApp</button><button class="btn" id="fCp">Copiar texto</button>' : '') + '<button class="btn" id="fAdd">+ Adicionar parcelas</button>' + (f.saldo > 0 ? '<button class="btn" id="fAj">Ajustar saldo</button>' : '') + '</div>' +
      '<div class="tw" style="max-height:300px"><table class="t"><thead><tr><th>#</th><th>Vencimento</th><th class="n">Valor</th><th class="n">Pago</th><th class="n">Saldo</th><th>Situação</th><th>Origem</th><th></th></tr></thead><tbody>' + (linhas || '<tr><td colspan="8" class="muted">Sem parcelas.</td></tr>') + '</tbody></table></div>' + pg);
    m.style.maxWidth = '860px';
    const recarrega = () => Receber.ficha(cid);
    $$('a[data-op]', m).forEach(a => a.onclick = e => { e.preventDefault(); Detalhe.abrir(a.dataset.op); });
    $('#fTel', m).onclick = async e => { e.preventDefault(); const t = await Receber.telefone(cid, f.cliente.telefone); if (t !== null) recarrega(); };
    if ($('#fPag', m)) { $('#fPag', m).onclick = () => Receber.pagar({ cliente_id: cid, nome: f.cliente.nome, saldo: f.saldo }, recarrega);
      $('#fWa', m).onclick = () => Receber.whats({ cliente_id: cid, telefone: f.cliente.telefone, mensagem: f.mensagem }); $('#fCp', m).onclick = () => Receber.copiar(f.mensagem); }
    $('#fAdd', m).onclick = () => Receber.adicionar({ id: cid, nome: f.cliente.nome }, recarrega);
    if ($('#fAj', m)) $('#fAj', m).onclick = () => Receber.ajustar(f, recarrega);
    $$('button[data-r]', m).forEach(b => b.onclick = () => { const p = f.parcelas.find(x => x.id === b.dataset.r); Receber.pagar({ parcela: { id: p.id, saldo: p.saldo, venc: p.venc }, nome: f.cliente.nome }, recarrega); });
    $$('button[data-e]', m).forEach(b => b.onclick = () => { const p = f.parcelas.find(x => x.id === b.dataset.e); Receber.editarParcela({ id: p.id, valor: p.valor, vencimento: p.venc, pago: p.pago, obs: p.obs, cliente_nome: f.cliente.nome }, recarrega); });
    $$('button[data-x]', m).forEach(b => b.onclick = async () => { const mt = await pedirTexto('Estornar recebimento', 'Motivo', true); if (!mt) return; const r = await apiT('recEstornar', { id: b.dataset.x, motivo: mt }); if (!r) return; toast('Recebimento estornado.', 'ok'); Atualizar.tudo(); recarrega(); });
  }
};

        '<div class="muted" style="font-size:13px;margin-top:2px">' + (x.telefone ? esc(x.telefone) : 'sem telefone') + ' · ' + x.parcelasVencidas + ' parcela(s) vencida(s) · saldo total ' + brl(x.saldo) + '</div></div>' +
        '<div style="text-align:right"><div class="muted" style="font-size:11px;letter-spacing:.1em">ATRASADO</div><div style="font-size:22px;color:var(--bad)">' + brl(x.valorVencido + x.valorHoje) + '</div></div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn pri sm" data-w="' + i + '">WhatsApp</button><button class="btn sm" data-c="' + i + '">Copiar texto</button><button class="btn sm" data-p="' + i + '">Registrar pagamento</button><button class="btn sm" data-f="' + i + '">Ver ficha</button></div></div>').join('');
    $$('button[data-w]', el).forEach(b => b.onclick = () => Receber.whats(c.clientes[+b.dataset.w])); $$('button[data-c]', el).forEach(b => b.onclick = () => Receber.copiar(c.clientes[+b.dataset.c].mensagem));
    $$('button[data-p]', el).forEach(b => b.onclick = () => { const x = c.clientes[+b.dataset.p]; Receber.pagar({ cliente_id: x.cliente_id, nome: x.nome, saldo: x.saldo }); });
    $$('button[data-f]', el).forEach(b => b.onclick = () => Receber.ficha(c.clientes[+b.dataset.f].cliente_id));
  },
  async aba_clientes() {
    const el = $('#rcCorpo'); el.innerHTML = '<div class="card"><input id="rcQ" placeholder="Buscar cliente…" value="' + esc(this.busca) + '" style="max-width:320px"><div id="rcLista" style="margin-top:10px"></div></div>';
    const lista = async () => { const r = await apiT('recClientes', { busca: this.busca }); if (!r) return; $('#rcLista').innerHTML = r.clientes.length ? tabela([
      { t: 'Cliente', k: 'nome' }, { t: 'Saldo', k: 'saldo', n: true, f: x => brl(x.saldo) }, { t: 'Vencido', k: 'valorVencido', n: true, f: x => x.valorVencido > 0 ? '<span style="color:var(--bad)">' + brl(x.valorVencido) + '</span>' : '—' },
      { t: 'Atraso', k: 'diasAtraso', n: true, f: x => x.diasAtraso ? x.diasAtraso + ' d' : '—' }, { t: 'Próx. venc.', k: 'proximoVenc', f: x => x.proximoVenc ? dataBR(x.proximoVenc) : '—' }, { t: 'Parcelas', k: 'parcelasAbertas', n: true }
    ].map(c => Object.assign({}, c)), r.clientes.map(x => Object.assign({ _k: x.cliente_id }, x)), { onRow: x => Receber.ficha(x.cliente_id) }) : '<div class="empty">Nenhum cliente com saldo a receber.</div>'; };
    $('#rcQ').oninput = debounce(() => { this.busca = $('#rcQ').value; lista(); }, 250); lista();
  },
  async aba_fluxo() {
    const el = $('#rcCorpo'); const f = await apiT('recFluxo'); if (!f) return; const p = this.painel;
    el.innerHTML = '<div class="grid g2">' + chartCard('rcFl', 'Vence nas próximas 8 semanas', '', 'valor em aberto por semana') + chartCard('rcAg', 'Atrasos por faixa', '', 'quanto tempo vencido') + '</div>' +
      '<div class="card" style="margin-top:14px"><h3>Resumo</h3><p>Vencido: <b>' + brl(f.vencido) + '</b> · Depois de 8 semanas: <b>' + brl(f.depois) + '</b></p></div>';
    grafico('rcFl', { type: 'bar', data: { labels: f.semanas.map(s => dataBR(s.de).slice(0, 5)), datasets: [{ label: 'A vencer', data: f.semanas.map(s => s.valor), backgroundColor: PAL.gold }] }, options: { scales: { y: eixoBRL }, plugins: { tooltip: tipBRL, legend: { display: false } } } });
    grafico('rcAg', { type: 'bar', data: { labels: p.aging.map(a => a.faixa), datasets: [{ label: 'Vencido', data: p.aging.map(a => a.valor), backgroundColor: PAL.burg }] }, options: { scales: { y: eixoBRL }, plugins: { tooltip: tipBRL, legend: { display: false } } } });
  },
  async aba_receb() {
    const el = $('#rcCorpo'); const r = await apiT('recRecebimentos', {}); if (!r) return;
    el.innerHTML = '<div class="card"><p class="muted">Últimos recebimentos · total ativo ' + brl(r.total) + '</p><div id="rcRb"></div></div>';
    $('#rcRb').innerHTML = r.itens.length ? '<div class="tw" style="max-height:480px"><table class="t"><thead><tr><th>Data</th><th>Cliente</th><th class="n">Valor</th><th>Obs.</th><th></th></tr></thead><tbody>' + r.itens.map(x => '<tr style="' + (x.status === 'ESTORNADO' ? 'opacity:.45;text-decoration:line-through' : '') + '"><td>' + dataBR(x.data) + '</td><td>' + esc(x.cliente_nome) + '</td><td class="n">' + brl(x.valor) + '</td><td>' + esc(x.obs) + '</td><td>' + (x.status === 'ATIVO' ? '<button class="btn sm" data-x="' + x.id + '">Estornar</button>' : '<span class="chip gray">estornado</span>') + '</td></tr>').join('') + '</tbody></table></div>' : '<div class="empty">Nenhum recebimento registrado ainda.</div>';
    $$('button[data-x]', el).forEach(b => b.onclick = async () => { const mt = await pedirTexto('Estornar recebimento', 'Motivo', true); if (!mt) return; const q = await apiT('recEstornar', { id: b.dataset.x, motivo: mt }); if (!q) return; toast('Recebimento estornado.', 'ok'); Atualizar.tudo(); });
  }
};
</script>

<script>
/* ============ LANÇAMENTOS ============ */
function autocomplete(input, buscar, rotulo, aoEscolher) {
  let box = null, seq = 0;
  const fechar = () => { if (box) { box.remove(); box = null; } };
  const abrir = async () => {
    const q = input.value.trim(); const mine = ++seq; let res = [];
    try { res = await buscar(q); } catch (e) { res = []; }
    if (mine !== seq) return; fechar(); if (!res || !res.length) return;
    box = document.createElement('div'); box.className = 'sugest';
    const r = input.getBoundingClientRect(); box.style.position = 'fixed'; box.style.left = r.left + 'px'; box.style.top = (r.bottom + 2) + 'px'; box.style.zIndex = 900;
    res.forEach(x => { const d = document.createElement('div'); d.innerHTML = rotulo(x); d.onmousedown = ev => { ev.preventDefault(); aoEscolher(x); fechar(); }; box.appendChild(d); });
    document.body.appendChild(box);
  };
  input.addEventListener('input', debounce(abrir, 250)); input.addEventListener('focus', () => { if (!input.value) abrir(); }); input.addEventListener('blur', () => setTimeout(fechar, 150));
  document.addEventListener('scroll', fechar, true);
}
const buscaProd = termo => api('produtosBuscar', { termo: termo });
const rotProd = p => '<span style="display:inline-block;min-width:48px">' + thumb(p.foto, 40) + '</span><b>' + esc(p.codigo) + '</b> · ' + esc(p.descricao) + ' <span class="muted">(' + esc(p.categoria) + ') saldo ' + p.saldo + (p.precoTabela ? ' · ' + brl(p.precoTabela) : '') + '</span>';

Views.lancamentos = {
  pronto: false, f: { tipo: 'TODOS', status: 'TODOS', de: '', ate: '', busca: '', pagina: 1 },
  abrir() { if (!this.pronto) { this.montar(); this.pronto = true; } },
  montar() {
    const f = this.f, root = $('#v-lancamentos');
    root.innerHTML = '<div class="page-h"><div><h1>Lançamentos</h1><p>Compras e vendas. Nada é apagado: edições e cancelamentos preservam o histórico e revertem estoque, cashback e indicadores.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="lNovaVenda">+ Nova venda</button><button class="btn gold" id="lNovaCompra">+ Nova compra</button></div></div>' +
      '<div class="filters"><label>Tipo<select id="lTipo"><option value="TODOS">Todos</option><option value="VENDA">Vendas</option><option value="COMPRA">Compras</option></select></label>' +
      '<label>Status<select id="lStatus"><option value="TODOS">Todos</option><option value="ATIVA">Ativa</option><option value="EDITADA">Editada</option><option value="CANCELADA">Cancelada</option></select></label>' +
      '<label>De<input type="date" id="lDe"></label><label>Até<input type="date" id="lAte"></label>' +
      '<label style="flex:1;min-width:200px">Buscar<input id="lBusca" placeholder="cliente, código, produto, nº da operação, NF…"></label><button class="btn" id="lLimpar">Limpar</button></div>' +
      '<div id="lResumo" class="muted" style="margin:0 0 8px"></div><div class="card" style="padding:8px"><div id="lLista"></div></div><div id="lPag" style="display:flex;gap:8px;justify-content:center;margin-top:12px"></div>';
    const ler = () => { f.tipo = $('#lTipo').value; f.status = $('#lStatus').value; f.de = $('#lDe').value; f.ate = $('#lAte').value; f.busca = $('#lBusca').value; f.pagina = 1; this.carregar(); };
    ['lTipo', 'lStatus', 'lDe', 'lAte'].forEach(i => $('#' + i).onchange = ler); $('#lBusca').oninput = debounce(ler, 450);
    $('#lLimpar').onclick = () => { ['lDe', 'lAte', 'lBusca'].forEach(i => $('#' + i).value = ''); $('#lTipo').value = 'TODOS'; $('#lStatus').value = 'TODOS'; ler(); };
    $('#lNovaVenda').onclick = () => Form.venda(); $('#lNovaCompra').onclick = () => Form.compra();
    this.carregar();
  },
  async carregar() {
    $('#lLista').innerHTML = '<div class="skel" style="height:220px"></div>';
    const d = await apiT('lancamentosListar', this.f); if (!d) return;
    $('#lResumo').innerHTML = num(d.total) + ' lançamento(s) · vendas ativas: <b>' + brl(d.somaVendas) + '</b> · compras ativas: <b>' + brl(d.somaCompras) + '</b>';
    const sc = { ATIVA: 'ok', EDITADA: 'gray', CANCELADA: 'bad' };
    d.itens.forEach(r => r._k = r.op_id);
    $('#lLista').innerHTML = tabela([{ t: 'Data', k: 'data', f: r => dataBR(r.data) }, { t: 'Nº', k: 'op_id' }, { t: 'Tipo', k: 'tipo', f: r => '<span class="chip ' + (r.tipo === 'VENDA' ? 'info' : 'warn') + '">' + (r.tipo === 'VENDA' ? 'Venda' : 'Compra') + '</span>' },
      { t: 'Cliente / Fornecedor', k: 'parte' }, { t: 'Itens', k: 'resumo', f: r => esc(r.resumo) + (r.itens > 1 ? ' <span class="muted">+' + (r.itens - 1) + '</span>' : '') }, { t: 'Peças', k: 'pecas', n: 1 }, { t: 'Total', k: 'total', n: 1, f: r => brl(r.total) },
      { t: 'Pgto', k: 'forma_pgto' }, { t: 'Status', k: 'status', f: r => '<span class="chip ' + (sc[r.status] || '') + '">' + esc(r.status) + '</span>' + (r.devolvido ? ' <span class="chip warn">devolução</span>' : '') }, { t: 'Origem', k: 'origem', f: r => '<span class="muted">' + esc(r.origem) + '</span>' }],
      d.itens, { onRow: r => Detalhe.abrir(r.op_id), h: 'none', max: 200 });
    $('#lPag').innerHTML = d.paginas > 1 ? '<button class="btn sm" ' + (d.pagina <= 1 ? 'disabled' : '') + ' id="pgA">‹ anterior</button><span class="muted" style="align-self:center">página ' + d.pagina + ' de ' + d.paginas + '</span><button class="btn sm" ' + (d.pagina >= d.paginas ? 'disabled' : '') + ' id="pgP">próxima ›</button>' : '';
    if ($('#pgA')) $('#pgA').onclick = () => { this.f.pagina--; this.carregar(); }; if ($('#pgP')) $('#pgP').onclick = () => { this.f.pagina++; this.carregar(); };
  }
};

/* ---------- detalhe / ações ---------- */
const Detalhe = {
  async abrir(opId) {
    const d = await apiT('lancamentoDetalhe', { op_id: opId }); if (!d) return;
    const v = d.tipo === 'VENDA', L = d.linhas, l0 = L[0];
    const sc = { ATIVA: 'ok', EDITADA: 'gray', CANCELADA: 'bad' };
    const podeAgir = d.status === 'ATIVA' && l0.origem !== undefined;
    const cols = v ? '<th>Cód.</th><th>Produto</th><th class="n">Qtd</th><th class="n">Preço</th><th class="n">Tabela</th><th class="n">Total</th><th>Status</th>' : '<th>Cód.</th><th>Produto</th><th class="n">Qtd</th><th class="n">Custo un.</th><th class="n">Desp. adic.</th><th class="n">Total</th><th>Status</th>';
    const rows = L.map(l => v ? '<tr><td>' + esc(l.codigo) + '</td><td>' + thumb(l.foto, 36) + esc(l.descricao) + '</td><td class="n">' + l.qtd + '</td><td class="n">' + brl(l.preco_unit) + '</td><td class="n">' + brl(l.preco_tabela) + '</td><td class="n">' + brl(l.qtd * l.preco_unit) + '</td><td><span class="chip ' + (sc[l.status] || '') + '">' + esc(l.status) + '</span></td></tr>'
      : '<tr><td>' + esc(l.codigo) + '</td><td>' + thumb(l.foto, 36) + esc(l.descricao) + '</td><td class="n">' + l.qtd + '</td><td class="n">' + brl(l.custo_unit) + '</td><td class="n">' + brl(l.despesas_adic) + '</td><td class="n">' + brl(l.qtd * l.custo_unit + (+l.despesas_adic || 0)) + '</td><td><span class="chip ' + (sc[l.status] || '') + '">' + esc(l.status) + '</span></td></tr>').join('');
    const hist = d.historico.length ? '<table class="t"><thead><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Observação</th></tr></thead><tbody>' + d.historico.map(h => '<tr><td class="nowrap">' + dataHoraBR(h.data) + '</td><td>' + esc(h.usuario) + '</td><td>' + esc(h.acao) + '</td><td>' + esc(h.obs) + '</td></tr>').join('') + '</tbody></table>' : '<div class="muted">Sem eventos registrados para esta operação (lançamento histórico importado).</div>';
    const dev = v && d.devolucoes && d.devolucoes.length ? '<h3 style="margin-top:16px">Devoluções</h3><table class="t"><thead><tr><th>Data</th><th>Cód.</th><th class="n">Qtd</th><th class="n">Valor</th><th>Motivo</th><th>Status</th></tr></thead><tbody>' + d.devolucoes.map(x => '<tr><td>' + dataBR(x.data) + '</td><td>' + esc(x.codigo) + '</td><td class="n">' + x.qtd + '</td><td class="n">' + brl(x.valor_total) + '</td><td>' + esc(x.motivo) + '</td><td>' + esc(x.status) + '</td></tr>').join('') + '</tbody></table>' : '';
    const recb = v && d.recebiveis && d.recebiveis.length ? '<h3 style="margin-top:16px">A receber (PIX parcelado)</h3><table class="t"><thead><tr><th>#</th><th>Vencimento</th><th class="n">Valor</th><th class="n">Pago</th><th>Situação</th></tr></thead><tbody>' + d.recebiveis.map(p => { const s = stRec[p.status] || ['', p.status]; return '<tr><td>' + p.numero + '</td><td>' + dataBR(p.vencimento) + (p.atrasada ? ' <span class="chip bad">atrasada</span>' : '') + '</td><td class="n">' + brl(p.valor) + '</td><td class="n">' + brl(p.pago) + '</td><td><span class="chip ' + s[0] + '">' + s[1] + '</span></td></tr>'; }).join('') + '</tbody></table><p class="muted" style="font-size:12px">Para receber, editar prazos ou valores das parcelas, use a aba <b>A Receber</b>.</p>' : '';
    const m = modal('<h2>' + (v ? 'Venda ' : 'Compra ') + esc(opId) + ' <span class="chip ' + (sc[d.status] || '') + '" style="font-size:13px;vertical-align:middle">' + esc(d.status) + '</span></h2>' +
      '<p class="muted" style="margin:0 0 10px">' + dataBR(l0.data) + ' · ' + esc(v ? l0.cliente_nome : l0.fornecedor_nome) + ' · ' + esc(l0.forma_pgto || '') + (l0.parcelas > 1 ? ' em ' + l0.parcelas + 'x' : '') + ' · <b>' + brl(d.total) + '</b>' +
      (d.substitui ? ' · substitui <a href="#" data-op="' + esc(d.substitui) + '">' + esc(d.substitui) + '</a>' : '') + (d.substituidaPor ? ' · substituída por <a href="#" data-op="' + esc(d.substituidaPor) + '">' + esc(d.substituidaPor) + '</a>' : '') + '</p>' +
      '<div class="tw" style="max-height:260px"><table class="t"><thead><tr>' + cols + '</tr></thead><tbody>' + rows + '</tbody></table></div>' + dev + recb +
      (l0.obs ? '<p><b>Obs.:</b> ' + esc(l0.obs) + '</p>' : '') + '<h3 style="margin-top:16px">Histórico</h3>' + hist +
      (d.status === 'ATIVA' ? '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap">' + (v ? '<button class="btn" id="dDev">Devolução</button>' : '') + '<button class="btn" id="dEd">Editar</button><button class="btn danger" id="dCan">Cancelar lançamento</button></div>' : ''));
    $$('a[data-op]', m).forEach(a => a.onclick = e => { e.preventDefault(); Detalhe.abrir(a.dataset.op); });
    if ($('#dEd', m)) $('#dEd', m).onclick = () => v ? Form.venda(d) : Form.compra(d);
    if ($('#dCan', m)) $('#dCan', m).onclick = async () => {
      const motivo = await pedirTexto('Cancelar ' + (v ? 'venda' : 'compra'), 'Motivo do cancelamento (o histórico será mantido; estoque' + (v ? ', cashback' : '') + ' e indicadores serão revertidos).', true); if (!motivo) return;
      const r = await apiT(v ? 'vendaCancelar' : 'compraCancelar', { op_id: opId, motivo: motivo }); if (r) { toast('Lançamento cancelado.', 'ok'); if (r.recebidoADevolver > 0) toast('Atenção: ' + brl(r.recebidoADevolver) + ' já havia sido recebido desta venda — devolva ao cliente.', 'err'); fecharModal(); Atualizar.tudo(); }
    };
    if ($('#dDev', m)) $('#dDev', m).onclick = () => this.devolucao(d);
  },
  devolucao(d) {
    const m = modal('<h2>Devolução — ' + esc(d.op_id) + '</h2><p class="muted">Informe as quantidades devolvidas. O estoque é reposto e o cashback gerado/usado é estornado proporcionalmente.</p><div class="form-grid" style="margin-bottom:10px"><label>Data da devolução<input type="date" id="dvData" value="' + hojeISO() + '"></label><label class="w2">Motivo<input id="dvMot" placeholder="ex.: defeito, troca, desistência"></label></div>' +
      '<table class="t"><thead><tr><th>Cód.</th><th>Produto</th><th class="n">Vendido</th><th class="n">Devolver</th></tr></thead><tbody>' + d.linhas.filter(l => l.status === 'ATIVA').map(l => '<tr><td>' + esc(l.codigo) + '</td><td>' + thumb(l.foto, 36) + esc(l.descricao) + '</td><td class="n">' + l.qtd + '</td><td class="n"><input type="number" min="0" max="' + l.qtd + '" value="0" data-cod="' + esc(l.codigo) + '" style="width:80px"></td></tr>').join('') + '</tbody></table>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn" onclick="fecharModal()">Voltar</button><button class="btn pri" id="dvOk">Registrar devolução</button></div>');
    $('#dvOk', m).onclick = async () => {
      const itens = $$('input[data-cod]', m).map(i => ({ codigo: i.dataset.cod, qtd: +i.value })).filter(i => i.qtd > 0);
      if (!itens.length) return toast('Informe ao menos uma quantidade.', 'err');
      const r = await apiT('vendaDevolver', { op_id: d.op_id, itens: itens, motivo: $('#dvMot', m).value, data: $('#dvData', m).value });
      if (r) { toast('Devolução registrada.', 'ok'); if (r.recebiveisReduzidos > 0) toast('Parcelas a receber reduzidas em ' + brl(r.recebiveisReduzidos) + '.', 'ok'); if (r.recebidoADevolver > 0) toast('Atenção: ' + brl(r.recebidoADevolver) + ' já pagos precisam ser devolvidos ao cliente.', 'err'); fecharModal(); Atualizar.tudo(); }
    };
  }
};
/** Depois de qualquer gravação: limpa caches das telas dependentes. */
const Atualizar = { async tudo() { if (typeof Mobile !== 'undefined') Mobile.aposSalvar(); } };

/* ---------- formulários ---------- */
const Form = {
  /* ===== VENDA ===== */
  venda(edit) {
    const l0 = edit ? edit.linhas[0] : null, idem = uid();
    const linhaTpl = (it) => '<tr class="vi"><td style="width:34%;position:relative"><input class="cod" placeholder="código ou nome do produto" value="' + esc(it ? it.codigo : '') + '"></td><td style="width:90px"><input type="number" min="1" class="qtd" value="' + (it ? it.qtd : 1) + '"></td><td style="width:140px"><input type="number" step="0.01" min="0" class="preco" value="' + (it ? it.preco_unit : '') + '" placeholder="preço"></td><td class="info muted" style="font-size:12px"></td><td style="width:40px"><button class="btn sm danger rm" title="Remover">×</button></td></tr>';
    const m = modal('<h2>' + (edit ? 'Editar venda ' + esc(edit.op_id) : 'Nova venda') + '</h2>' + (edit ? '<div class="aviso info">A venda original será marcada como <b>EDITADA</b> (histórico preservado) e uma nova venda vinculada será criada. Estoque, cashback e indicadores são recalculados.</div>' : '') +
      '<div class="form-grid"><label>Data<input type="date" id="vData" value="' + esc(l0 ? String(l0.data).slice(0, 10) : hojeISO()) + '"></label>' +
      '<label class="w2" style="position:relative">Cliente<input id="vCli" autocomplete="off" placeholder="digite para buscar ou cadastrar" value="' + esc(l0 ? l0.cliente_nome : '') + '"><span class="muted" id="vCliInfo" style="text-transform:none;letter-spacing:0;font-size:12px"></span></label>' +
      '<label>Forma de pagamento<select id="vPg">' + App.boot.formasPagamento.map(f => '<option' + (l0 && l0.forma_pgto === f ? ' selected' : '') + '>' + esc(f) + '</option>').join('') + '</select></label>' +

<script>
/* ============ App do iPhone: ponte nativa, início e conexão ============ */
const NATIVO = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.nativo);
const Nativo = {
  _id: 0, _p: {},
  chamar(acao, dados) {
    return new Promise((res, rej) => {
      const id = ++this._id; this._p[id] = { res: res, rej: rej };
      try { window.webkit.messageHandlers.nativo.postMessage(Object.assign({ id: id, acao: acao }, dados || {})); }
      catch (e) { delete this._p[id]; rej(new Error('Este código só roda dentro do aplicativo.')); }
    });
  }
};
/* resposta do Swift: JSON em base64 (evita problemas de aspas/acentos) */
window.__nativo = function (id, b64) {
  const p = Nativo._p[id]; if (!p) return; delete Nativo._p[id];
  try { p.res(JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0))))); } catch (e) { p.rej(e); }
};
/* google.script.run (usado pelo código dos formulários) → ponte nativa → Apps Script. Na versão web (servida pelo próprio Apps Script) o google.script.run real é mantido. */
if (NATIVO) window.google = { script: { run: (function mk(ok, fail) {
  return {
    withSuccessHandler: s => mk(s, fail), withFailureHandler: f => mk(ok, f),
    api: (rota, payload) => { Nativo.chamar('api', { rota: rota, payload: payload || {} }).then(r => ok && ok(r)).catch(e => fail && fail({ message: (e && e.message) || String(e) })); }
  };
})() } };

/* pequenos ajustes de comportamento para toque */

window.toast = function (msg, tipo) { _toastOrig(msg, tipo); if (!NATIVO) return; if (tipo === 'ok') Nativo.chamar('haptico', { tipo: 'ok' }).catch(() => {}); else if (tipo === 'err') Nativo.chamar('haptico', { tipo: 'err' }).catch(() => {}); };
window.modal = function (h, o) { document.body.classList.add('modal-on'); return _modalOrig(h, o); };
window.fecharModal = function () { document.body.classList.remove('modal-on'); _fecharOrig(); };
/* lista de sugestões otimizada para toque e teclado do iPhone */
function autocomplete(input, buscar, rotulo, aoEscolher) {
  let box = null, seq = 0, tocando = false;
  const fechar = () => { if (box) { box.remove(); box = null; } };
  const abrir = async () => {
    const q = input.value.trim(), mine = ++seq; let res = [];
    try { res = await buscar(q); } catch (e) { res = []; }
    if (mine !== seq || document.activeElement !== input) return; fechar(); if (!res || !res.length) return;
    box = document.createElement('div'); box.className = 'sugest'; box.style.position = 'fixed'; box.style.left = '8px'; box.style.right = '8px'; box.style.zIndex = 900;
    const vv = window.visualViewport, r = input.getBoundingClientRect(), base = vv ? vv.offsetTop : 0, vh = vv ? vv.height : innerHeight;
    const abaixo = base + vh - r.bottom, acima = r.top - base;
    if (abaixo < 220 && acima > abaixo) { box.style.bottom = (innerHeight - r.top + 4) + 'px'; box.style.maxHeight = Math.max(120, acima - 12) + 'px'; }
    else { box.style.top = (r.bottom + 4) + 'px'; box.style.maxHeight = Math.max(120, abaixo - 12) + 'px'; }
    res.forEach(x => { const d = document.createElement('div'); d.innerHTML = rotulo(x); d.onclick = () => { aoEscolher(x); fechar(); }; box.appendChild(d); });
    box.addEventListener('touchstart', () => { tocando = true; }, { passive: true }); box.addEventListener('touchend', () => setTimeout(() => { tocando = false; }, 400), { passive: true });
    document.body.appendChild(box);
  };
  input.addEventListener('input', debounce(abrir, 250)); input.addEventListener('focus', () => { if (!input.value) abrir(); });
  input.addEventListener('blur', () => setTimeout(() => { if (!tocando) fechar(); }, 200));
}

const Mobile = {
  ICO_VENDA: '<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16h28l-2.5 22a3 3 0 0 1-3 2.6H15.5a3 3 0 0 1-3-2.6L10 16z"/><path d="M17 20v-5a7 7 0 0 1 14 0v5"/><path d="M24 25l1.8 3.6 4 .6-2.9 2.8.7 4-3.6-1.9-3.6 1.9.7-4-2.9-2.8 4-.6z"/></svg>',
  ICO_COMPRA: '<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5l16 8.5v21L24 43 8 34.5v-21L24 5z"/><path d="M8 13.5l16 8.5 16-8.5M24 22v21"/><path d="M16 9.5l16 8.7"/></svg>',
  cfg: { url: '', tem: false, bloqueio: true },

  async iniciar() {
    if (NATIVO) {
      try { this.cfg = await Nativo.chamar('cfgGet'); } catch (e) { this.cfg = { url: '', tem: false, bloqueio: true }; }
      await Nativo.chamar('liberado').catch(() => {});        // espera o desbloqueio (Face ID) antes da animação
    } else this.cfg = { url: '', tem: true, bloqueio: false }; // versão web: o login Google do Apps Script já identifica a pessoa
    $('#app').classList.add('on');
    splash(() => this.depoisDaAnimacao());
    $('#mCfg').onclick = () => this.ajustes();
  },
  async depoisDaAnimacao() {
    if (!this.cfg.tem) return this.conectar();
    await this.entrar();
  },
  async entrar() {
    $('#mMain').innerHTML = '<div class="skel" style="height:96px;border-radius:18px;margin-bottom:14px"></div>'.repeat(2);
    try { App.boot = await api('bootstrap', { leve: true }); }
    catch (e) {
      if (NATIVO && (e.codigo === 'TOKEN' || e.codigo === 'BLOQUEADO')) return this.conectar(e.message);
      $('#mMain').innerHTML = '<div class="card m"><h3>Sem conexão com o sistema</h3><p class="muted">' + esc(e.message) + '</p><button class="btn pri" id="mRetry" style="width:100%">Tentar de novo</button></div>';
      $('#mRetry').onclick = () => this.entrar(); return;
    }
    App.papel = App.boot.papel; this.inicio();
  },
  inicio() {
    const nome = String(App.boot.usuario || '').replace(/^app:/, '');
    $('#mMain').innerHTML = '<div class="hero"><h1>Olá' + (nome ? ', ' + esc(nome.split(' ')[0]) : '') + '</h1><p>O que vamos lançar agora?</p></div>' +
      '<button class="big venda" id="mVenda">' + this.ICO_VENDA + '<span><b>Nova venda</b><small>Cliente, itens, pagamento e cashback</small></span></button>' +
      '<button class="big compra" id="mCompra">' + this.ICO_COMPRA + '<span><b>Nova compra</b><small>Entrada de mercadoria, fotos e códigos</small></span></button>' +
      '<div class="foot" id="mUlt"></div>';
    $('#mVenda').onclick = () => Form.venda(); $('#mCompra').onclick = () => Form.compra();
    this.atualizaUltimo();
  },
  async atualizaUltimo() {
    try { const u = await api('codigoUltimo'); if ($('#mUlt')) $('#mUlt').innerHTML = u && u.ultimo ? 'Último código cadastrado: <b>' + esc(u.ultimo) + '</b>' : ''; } catch (e) { /* opcional */ }
  },
  aposSalvar() { this.atualizaUltimo(); },

  conectar(aviso) {
    $('#mMain').innerHTML = '<div class="hero"><h1>Conectar ao sistema</h1><p>Informe os dados que o administrador gerou em <b>Configurações › App do iPhone</b>.</p></div>' +
      '<div class="card m">' + (aviso ? '<div class="aviso bad">' + esc(aviso) + '</div>' : '') +
      '<label>Endereço do sistema (URL)<input id="mUrl" inputmode="url" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(this.cfg.url || '') + '"></label>' +
      '<label>Código de acesso<input id="mTok" autocapitalize="none" autocorrect="off" spellcheck="false" type="password" placeholder="40 caracteres"></label>' +
      '<button class="btn pri" id="mConectar" style="width:100%;min-height:50px;font-size:15px">Conectar</button></div>';
    $('#mConectar').onclick = async () => {
      const url = $('#mUrl').value.trim(), token = $('#mTok').value.trim();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(url)) return toast('O endereço deve terminar em /exec e começar com https://script.google.com/macros/s/', 'err');
      if (token.length < 24) return toast('Digite o código de acesso completo.', 'err');
      const b = $('#mConectar'); b.disabled = true; b.textContent = 'Conectando…';
      const r = await Nativo.chamar('api', { rota: 'bootstrap', payload: { leve: true }, url: url, token: token }).catch(e => ({ ok: false, erro: { mensagem: e.message } }));
      b.disabled = false; b.textContent = 'Conectar';
      if (!r || !r.ok) return toast((r && r.erro && r.erro.mensagem) || 'Não consegui conectar.', 'err');
      await Nativo.chamar('cfgSet', { url: url, token: token }); this.cfg = { url: url, tem: true, bloqueio: this.cfg.bloqueio };
      toast('Conectado!', 'ok'); this.entrar();
    };
  },
  ajustes() {
    const usuario = esc(String((App.boot && App.boot.usuario) || '—').replace(/^app:/, ''));
    if (!NATIVO) {
      modal('<h2>Ajustes</h2><div class="card m" style="box-shadow:none;border:1px solid var(--line)"><p style="margin-top:0"><b>' + usuario + '</b><br><span class="muted">' + esc((App.boot && App.boot.papel) || '') + '</span></p>' +
        '<button class="btn" id="mAtualiza" style="width:100%;margin-bottom:10px">Recarregar</button></div>' +
        '<p class="muted center" style="font-size:12px">Versão web para celular · lançamento de vendas e compras</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="fecharModal()">Fechar</button></div>');
      $('#mAtualiza').onclick = () => location.reload(); return;
    }
    const m = modal('<h2>Ajustes</h2><div class="card m" style="box-shadow:none;border:1px solid var(--line)"><p style="margin-top:0"><b>' + usuario + '</b><br><span class="muted" style="word-break:break-all;font-size:12px">' + esc(this.cfg.url || 'não conectado') + '</span></p>' +      '<label style="flex-direction:row;align-items:center;justify-content:space-between;text-transform:none;letter-spacing:0;font-size:15px;color:var(--text)">Bloquear com Face ID / senha<input type="checkbox" id="mBloq" style="width:28px;height:28px;min-height:0"' + (this.cfg.bloqueio ? ' checked' : '') + '></label>' +
      '<button class="btn" id="mTroca" style="width:100%;margin-bottom:10px">Trocar código de acesso</button><button class="btn danger" id="mSair" style="width:100%">Desconectar este aparelho</button></div>' +
      '<p class="muted center" style="font-size:12px">App Márcia Colmati Semijoias · lançamento de vendas e compras</p>' +
      '<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" onclick="fecharModal()">Fechar</button></div>');
    $('#mBloq', m).onchange = async e => { this.cfg.bloqueio = e.target.checked; await Nativo.chamar('cfgSet', { bloqueio: e.target.checked }); toast(e.target.checked ? 'Bloqueio ativado.' : 'Bloqueio desativado.', 'ok'); };
    $('#mTroca', m).onclick = () => { fecharModal(); this.conectar(); };
    $('#mSair', m).onclick = async () => { if (!(await confirmar('Desconectar este aparelho? Será preciso digitar o código de novo.', 'Desconectar'))) return; await Nativo.chamar('cfgLimpar'); this.cfg = { url: '', tem: false, bloqueio: this.cfg.bloqueio }; App.boot = null; fecharModal(); this.conectar(); };
  }
};
window.addEventListener('DOMContentLoaded', () => Mobile.iniciar());
</script>

</body>
</html>
